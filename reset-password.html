<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إعادة تعيين كلمة المرور</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/storefront.css">
  <link rel="stylesheet" href="assets/css/admin.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔑</text></svg>">
  <style>
    .reset-wrap { display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }
    .reset-card { background:#fff; border-radius:16px; padding:40px; max-width:420px; width:100%; box-shadow:0 8px 32px rgba(0,0,0,.12); text-align:center; }
    .reset-card h1 { font-size:22px; margin:12px 0 8px; }
    .reset-card p { color:#666; font-size:14px; margin:0 0 24px; }
    .reset-card .form-group { text-align:right; margin-bottom:16px; }
    .reset-card .form-label { display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:#333; }
    .reset-card .form-control { width:100%; padding:10px 14px; border:1px solid #ddd; border-radius:8px; font-size:15px; box-sizing:border-box; }
    .reset-card .form-control:focus { border-color:#2563eb; outline:none; box-shadow:0 0 0 3px rgba(37,99,235,.15); }
    .reset-card .btn { width:100%; margin-top:8px; }
    .msg { padding:12px 16px; border-radius:8px; margin:16px 0; font-size:14px; text-align:center; }
    .msg-ok { background:#ecfdf5; color:#065f46; border:1px solid #a7f3d0; }
    .msg-err { background:#fef2f2; color:#991b1b; border:1px solid #fecaca; }
    .msg-info { background:#eff6ff; color:#1e40af; border:1px solid #bfdbfe; }
    .back-link { display:inline-block; margin-top:20px; color:#2563eb; text-decoration:none; font-size:14px; }
    .back-link:hover { text-decoration:underline; }
    .pwd-hint { font-size:11px; color:#888; margin-top:4px; text-align:right; }
  </style>
</head>
<body class="login-wrap">
  <div class="reset-card" id="reset-card">
    <div class="login-logo">🔑</div>
    <h1>إعادة تعيين كلمة المرور</h1>
    <p id="status-msg">جاري التحقق من الرابط...</p>
    <div id="form-area" style="display:none">
      <form id="reset-form">
        <div class="form-group">
          <label class="form-label">كلمة المرور الجديدة</label>
          <input class="form-control" id="new-pass" type="password" autocomplete="new-password" placeholder="أدخل كلمة المرور الجديدة" required minlength="6">
          <div class="pwd-hint">6 أحرف على الأقل</div>
        </div>
        <div class="form-group">
          <label class="form-label">تأكيد كلمة المرور</label>
          <input class="form-control" id="confirm-pass" type="password" autocomplete="new-password" placeholder="أعد إدخال كلمة المرور" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">تحديث كلمة المرور</button>
      </form>
    </div>
    <div id="result-area" style="display:none"></div>
    <a class="back-link" href="admin.html" id="back-link" style="display:none">العودة إلى صفحة الدخول</a>
  </div>

  <script src="assets/js/supabase-config.js"></script>
  <script>
  (function() {
    'use strict';

    var statusMsg = document.getElementById('status-msg');
    var formArea  = document.getElementById('form-area');
    var resultArea = document.getElementById('result-area');
    var backLink  = document.getElementById('back-link');
    var resetForm = document.getElementById('reset-form');
    var submitBtn = document.getElementById('submit-btn');

    var accessToken = null;

    // Extract token from URL hash (#access_token=...&type=recovery...)
    // or query string (?access_token=...&type=recovery...)
    function extractToken() {
      var hash = window.location.hash;
      var qs   = window.location.search;
      var params = new URLSearchParams(qs);
      var hashParams = new URLSearchParams(hash.substring(1));

      var token  = params.get('access_token')  || hashParams.get('access_token');
      var type   = params.get('type')           || hashParams.get('type');
      var code   = params.get('code')           || hashParams.get('code');

      if (type === 'recovery' && token) return { token: token, type: 'recovery' };
      if (code) return { code: code, type: 'pkce' };
      return null;
    }

    function showMsg(html, cls) {
      resultArea.innerHTML = '<div class="msg ' + cls + '">' + html + '</div>';
      resultArea.style.display = 'block';
    }

    function init() {
      var data = extractToken();

      if (!data) {
        statusMsg.textContent = 'رابط إعادة التعيين غير صالح أو منتهي الصلاحية.';
        statusMsg.style.color = '#991b1b';
        backLink.style.display = 'inline-block';
        return;
      }

      if (data.type === 'recovery' && data.token) {
        // Implicit grant flow: token is in the URL fragment
        statusMsg.textContent = 'تم التحقق بنجاح. أدخل كلمة المرور الجديدة.';
        statusMsg.style.color = '#065f46';
        formArea.style.display = 'block';
        backLink.style.display = 'inline-block';
        accessToken = data.token;
      } else if (data.type === 'pkce' && data.code) {
        // PKCE flow: exchange code for session using the Supabase client
        statusMsg.textContent = 'جاري المصادقة...';
        exchangePKCE(data.code);
      } else {
        statusMsg.textContent = 'رابط إعادة التعيين غير صالح.';
        statusMsg.style.color = '#991b1b';
        backLink.style.display = 'inline-block';
      }
    }

    async function exchangePKCE(code) {
      try {
        var s = window.__supabase;
        if (!s || !s.client) {
          statusMsg.textContent = 'Supabase client غير متوفر.';
          statusMsg.style.color = '#991b1b';
          backLink.style.display = 'inline-block';
          return;
        }
        // For PKCE, Supabase JS v2 handles the code exchange automatically
        // when detectSessionInUrl is true. Since it's false, we set session manually.
        var { data, error } = await s.client.auth.exchangeCodeForSession(code);
        if (error) {
          statusMsg.textContent = 'فشل المصادقة: ' + error.message;
          statusMsg.style.color = '#991b1b';
          backLink.style.display = 'inline-block';
          return;
        }
        // Session is now established — prompt user to set new password
        statusMsg.textContent = 'تم المصادقة بنجاح. أدخل كلمة المرور الجديدة.';
        statusMsg.style.color = '#065f46';
        formArea.style.display = 'block';
        backLink.style.display = 'inline-block';
        accessToken = null; // session already active, updateUser will work directly
      } catch (e) {
        statusMsg.textContent = 'خطأ غير متوقع: ' + e.message;
        statusMsg.style.color = '#991b1b';
        backLink.style.display = 'inline-block';
      }
    }

    resetForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      var newPass = document.getElementById('new-pass').value;
      var confirm = document.getElementById('confirm-pass').value;

      if (newPass.length < 6) {
        showMsg('كلمة المرور يجب أن تكون 6 أحرف على الأقل.', 'msg-err');
        return;
      }
      if (newPass !== confirm) {
        showMsg('كلمتا المرور غير متطابقتين.', 'msg-err');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'جاري التحديث...';

      try {
        var s = window.__supabase;
        if (!s || !s.client) {
          showMsg('Supabase client غير متوفر.', 'msg-err');
          submitBtn.disabled = false;
          submitBtn.textContent = 'تحديث كلمة المرور';
          return;
        }

        // If we have an access_token (implicit grant), set the session first
        if (accessToken) {
          var { error: sessionErr } = await s.client.auth.setSession({
            access_token: accessToken,
            refresh_token: ''
          });
          if (sessionErr) {
            showMsg('فشل إنشاء الجلسة: ' + sessionErr.message, 'msg-err');
            submitBtn.disabled = false;
            submitBtn.textContent = 'تحديث كلمة المرور';
            return;
          }
        }

        // Update password
        var { data, error } = await s.client.auth.updateUser({ password: newPass });

        if (error) {
          showMsg('فشل التحديث: ' + error.message, 'msg-err');
          submitBtn.disabled = false;
          submitBtn.textContent = 'تحديث كلمة المرور';
          return;
        }

        // Success
        formArea.style.display = 'none';
        statusMsg.textContent = 'تم تحديث كلمة المرور بنجاح!';
        statusMsg.style.color = '#065f46';
        showMsg('يمكنك الآن الدخول بكلمة المرور الجديدة من <a href="admin.html" style="color:#2563eb;font-weight:600">صفحة لوحة التحكم</a>.', 'msg-ok');
        backLink.style.display = 'inline-block';
        resetForm.reset();

      } catch (e) {
        showMsg('خطأ غير متوقع: ' + e.message, 'msg-err');
        submitBtn.disabled = false;
        submitBtn.textContent = 'تحديث كلمة المرور';
      }
    });

    init();
  })();
  </script>
</body>
</html>
